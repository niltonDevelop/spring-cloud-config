server.port=8005
configuration.port=8005
configuration.texto=Configurando entorno Defecto

# Micrometer Tracing — https://docs.micrometer.io/tracing/reference/
management.tracing.sampling.probability=0.1
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.observations.annotations.enabled=true
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false